server.port=8080
spring.application.name=HarborFlow-Gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.routes[0].id=carrier-service
spring.cloud.gateway.routes[0].uri=lb://HARBORFLOW-CARRIER
spring.cloud.gateway.routes[0].predicates[0]=Path=/carrier/**
spring.cloud.gateway.routes[1].id=container-service
spring.cloud.gateway.routes[1].uri=lb://HARBORFLOW-CONTAINER
spring.cloud.gateway.routes[1].predicates[0]=Path=/container/**
spring.cloud.gateway.routes[2].id=yard-service
spring.cloud.gateway.routes[2].uri=lb://HARBORFLOW-YARD
spring.cloud.gateway.routes[2].predicates[0]=Path=/yard/**
spring.cloud.gateway.routes[3].id=gate-service
spring.cloud.gateway.routes[3].uri=lb://HARBORFLOW-GATE
spring.cloud.gateway.routes[3].predicates[0]=Path=/gate/**
